<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none">
  <defs>
    <linearGradient id="logo-blue-half" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4FF"/>
      <stop offset="100%" stop-color="#0055FF"/>
    </linearGradient>
    <linearGradient id="logo-orange-half" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FF3700"/>
    </linearGradient>
    <filter id="logo-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0055FF" flood-opacity="0.18"/>
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#FF5A00" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- ISOTYPE: Location Pin + Duo Chromatic Cut + Integrated Shopping Cart -->
  <g transform="translate(6, 4)" filter="url(#logo-shadow)">
    <!-- Blue Left Half -->
    <path d="M32 4C19.85 4 10 13.85 10 26C10 39.5 28 56 32 60V4Z" fill="url(#logo-blue-half)"/>
    
    <!-- Orange Right Half -->
    <path d="M32 4C44.15 4 54 13.85 54 26C54 39.5 36 56 32 60V4Z" fill="url(#logo-orange-half)"/>

    <!-- Dynamic Split Line Accent -->
    <line x1="32" y1="4" x2="32" y2="60" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.4"/>

    <!-- Central Minimalist Base Badge -->
    <circle cx="32" cy="26" r="16" fill="#FFFFFF"/>

    <!-- Cart Contour -->
    <path d="M23 20H25.6L28 31.5H37.2L39.4 23H26.5" stroke="#0B0D10" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="29" cy="35" r="1.8" fill="#0066FF"/>
    <circle cx="36.5" cy="35" r="1.8" fill="#FF5A00"/>

    <!-- Spark Energy Ray inside Bag -->
    <path d="M32.5 18.5L29.5 23.5H34L31.5 28.5" stroke="#FF5A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- LOGOTYPE WORDMARK -->
  <text x="78" y="49" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" letter-spacing="-1.5" fill="#0B0D10">
    Traigalo
  </text>

  <!-- Accent Energy Spark Dot -->
  <path d="M252 23L246 32H251L248 40L257 29H251.5L254 23Z" fill="#FF5A00"/>
</svg>